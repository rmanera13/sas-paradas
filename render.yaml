# Paradas de Máquina · Weise — v2.0.0
# Os dados ficam num PostgreSQL externo (ex.: Neon), então NÃO se perdem em deploy/reinício.
# Informe a connection string em: Render > serviço > Environment > DATABASE_URL
services:
  - type: web
    name: sas-paradas
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # o Render pede o valor na criação; fica fora do GitHub (segurança)
