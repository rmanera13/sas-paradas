<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paradas de Máquina · Weise{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/icone.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="marca">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Weise" class="logo"
           onerror="this.style.display='none'">
      <h1>Paradas de Máquina</h1>
    </div>
    <nav aria-label="Principal">
      <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Apontamento</a>
      <a href="/dashboard" {% if request.path == '/dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
    </nav>
  </header>
  <main id="conteudo" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="rodape">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="" class="logo-rodape">
    <span>Weise · Sistema de Apontamento de Paradas · <strong>v{{ versao }}</strong></span>
  </footer>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
